<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141c24" />
      <stop offset="45%" stop-color="#0a0d12" />
      <stop offset="100%" stop-color="#050709" />
    </radialGradient>
    
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Shield & Accents -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGlow)" />
  <circle cx="400" cy="380" r="300" fill="url(#coreGlow)" />
  <circle cx="400" cy="400" r="220" fill="url(#orangeGlow)" />

  <!-- Technical Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
  </g>

  <!-- Radar / Telemetry Circles -->
  <g fill="none" stroke="#10b981" opacity="0.25">
    <circle cx="400" cy="360" r="240" stroke-dasharray="6 8" stroke-width="1" />
    <circle cx="400" cy="360" r="180" stroke-width="1.2" />
    <circle cx="400" cy="360" r="120" stroke-dasharray="4 6" stroke-width="1" />
  </g>

  <!-- Crosshair Ticks -->
  <g stroke="#10b981" stroke-width="2" opacity="0.6">
    <line x1="400" y1="100" x2="400" y2="125" />
    <line x1="400" y1="595" x2="400" y2="620" />
    <line x1="140" y1="360" x2="165" y2="360" />
    <line x1="635" y1="360" x2="660" y2="360" />
  </g>

  <!-- Corner Brackets (HUD Tech Frame) -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.4">
    <path d="M 60 110 L 60 60 L 110 60" />
    <path d="M 740 110 L 740 60 L 690 60" />
    <path d="M 60 690 L 60 740 L 110 740" />
    <path d="M 740 690 L 740 740 L 690 740" />
  </g>

  <!-- Center Hexagonal Shield Emblem -->
  <g filter="url(#softShadow)">
    <!-- Outer Glow Rim -->
    <path d="M 400 190 L 540 260 L 540 450 L 400 535 L 260 450 L 260 260 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#neonGlow)" opacity="0.8" />
    
    <!-- Shield Body -->
    <path d="M 400 196 L 534 263 L 534 445 L 400 528 L 266 445 L 266 263 Z" 
          fill="url(#shieldInner)" stroke="#334155" stroke-width="2" />

    <!-- Inner Circuit Lines inside Shield -->
    <g stroke="#10b981" stroke-width="1.5" opacity="0.4" fill="none">
      <path d="M 400 240 L 400 320" />
      <path d="M 400 320 L 340 360" />
      <path d="M 400 320 L 460 360" />
      <circle cx="400" cy="320" r="4" fill="#10b981" />
      <circle cx="340" cy="360" r="3.5" fill="#f97316" />
      <circle cx="460" cy="360" r="3.5" fill="#f97316" />
    </g>

    <!-- Monogram WI -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">
      <!-- Shadow -->
      <text x="400" y="405" font-size="110" fill="#000000" opacity="0.6">WI</text>
      <!-- Gradient Fill -->
      <text x="400" y="400" font-size="110" fill="url(#textGrad)" letter-spacing="4">WI</text>
    </g>

    <!-- Glowing Core Pulse -->
    <circle cx="400" cy="460" r="6" fill="#f97316" filter="url(#neonGlow)" />
    <circle cx="400" cy="460" r="3" fill="#ffffff" />
  </g>

  <!-- Typography: Product Title & Badges -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <!-- Brand Name -->
    <text x="400" y="630" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="6">
      WEB<tspan fill="url(#amberGrad)">INTEL</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="665" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="4" text-transform="uppercase">
      Autonomous Intelligence &amp; MCP Suite
    </text>

    <!-- Badge Pills -->
    <g transform="translate(400, 705)">
      <!-- Pill 1: 10 Tools -->
      <rect x="-170" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="-157" cy="13" r="3.5" fill="#10b981" />
      <text x="-115" y="17" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="1">10 TOOLS</text>

      <!-- Pill 2: TDQS Tier A -->
      <rect x="-55" y="0" width="110" height="26" rx="13" fill="#0f172a" stroke="#047857" stroke-width="1.2" />
      <circle cx="-42" cy="13" r="3.5" fill="#10b981" />
      <text x="3" y="17" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">TDQS 4.4 A</text>

      <!-- Pill 3: SSRF Armor -->
      <rect x="65" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="78" cy="13" r="3.5" fill="#f97316" />
      <text x="122" y="17" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="1">SSRF SAFE</text>
    </g>
  </g>
</svg>
